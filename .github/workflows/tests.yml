name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }}, Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies and the project
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .
          python -m pip freeze --exclude-editable
      - name: Run the full test suite
        # Test folders (run folders with manifests, worker logs and recordings) go under
        # RUNNER_TEMP so they can be uploaded if anything fails.
        run: |
          set -o pipefail
          python -m pytest -v -p no:cacheprovider --basetemp="$RUNNER_TEMP/pytest" 2>&1 | tee "$RUNNER_TEMP/pytest.log"
      - name: Keep logs and test run folders from a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-tests-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/pytest.log
            ${{ runner.temp }}/pytest/
          retention-days: 14
          if-no-files-found: warn
