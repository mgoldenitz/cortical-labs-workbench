[project]
name = "cl-workbench"
version = "0.1.0"
description = "Seeded recorder, integrity checks, metrics and static HTML report for the Cortical Labs cl-sdk simulator"
readme = "README.md"
requires-python = ">=3.12"
# cl-sdk is pinned exactly: the integrity checks, the private electrode-layout
# import (src/workbench/layout.py) and the determinism results were verified
# against 1.0.0 only. cl-sdk itself is licensed CC BY-NC 4.0; see docs/licensing.md.
dependencies = [
    "cl-sdk==1.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# Placeholder for the proposed AWS artifact layer (docs/aws-proposal.md).
# Nothing in the core imports it, and no AWS code exists yet.
aws = []

[project.scripts]
workbench = "workbench.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "sdk: starts the cl-sdk simulator in a child process (slower)",
]
